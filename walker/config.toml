# Reserve # for the project provider; pass application arguments with ::.
global_argument_delimiter = "::"

[keybinds]
previous = ["Up", "ctrl p", "ctrl k"]
next = ["Down", "ctrl n", "ctrl j"]

[providers]
default = ["desktopapplications", "calc", "websearch", "menus:session", "menus:connectivity"]

[[providers.prefixes]]
prefix = "#"
provider = "menus:projects"

# Walker's own defaults (/etc/xdg/walker/config.toml) already claim ; > / . ! % = @ : $ and are
# matched first, so only unused characters work here. @ is web search and : is the clipboard
# history in the defaults; these two providers get their own prefixes.
[[providers.prefixes]]
prefix = "+"
provider = "bluetooth"

[[providers.prefixes]]
prefix = "&"
provider = "wireplumber"

[placeholders]
"menus:projects" = { input = "Projects", list = "No matching projects" }
