# Reserve # for the project provider; pass application arguments with ::.
global_argument_delimiter = "::"

[keybinds]
previous = ["Up", "ctrl p", "ctrl k"]
next = ["Down", "ctrl n", "ctrl j"]

[providers]
default = ["desktopapplications", "calc", "websearch", "menus:session"]

[[providers.prefixes]]
prefix = "#"
provider = "menus:projects"

[placeholders]
"menus:projects" = { input = "Projects", list = "No matching projects" }
