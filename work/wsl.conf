# Installed as /etc/wsl.conf by `just setup wsl`. Changes apply after `wsl --shutdown`.
[boot]
# User services, ssh-agent sockets and systemd units work with systemd enabled.
systemd=true

[interop]
enabled=true
# Set to false for faster PATH lookups and tab completion (the Windows PATH is no longer
# appended, so code, explorer.exe and clip.exe must then be called by full path).
appendWindowsPath=true

[automount]
enabled=true
options="metadata,umask=022,fmask=011"
