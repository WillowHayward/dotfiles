# Termux settings, linked to ~/.termux/termux.properties by `just setup termux`.
# Apply changes with `termux-reload-settings`.

# Two rows of extra keys for tmux and Neovim without a hardware keyboard. PFX sends the
# tmux prefix (Ctrl-Space); swipe up on a key for its popup.
extra-keys = [[ \
  {key: ESC, popup: {macro: "ESC : w ENTER", display: ":w"}}, \
  {macro: "CTRL SPACE", display: "PFX"}, \
  {key: "/", popup: BACKSLASH}, \
  {key: "-", popup: "_"}, \
  {key: "|", popup: "&"}, \
  {key: HOME, popup: PGUP}, \
  {key: UP}, \
  {key: END, popup: PGDN}, \
  {key: BKSP, popup: DEL} \
], [ \
  {key: TAB}, \
  {key: CTRL}, \
  {key: ALT}, \
  {key: ":", popup: ";"}, \
  {key: "~", popup: "`"}, \
  {key: LEFT}, \
  {key: DOWN}, \
  {key: RIGHT}, \
  {key: KEYBOARD, popup: DRAWER} \
]]
extra-keys-text-all-caps = false

# The back button is Escape (vi mode in zsh, Neovim); the session drawer is on the
# KEYBOARD key's popup above, and swiping in from the left edge.
back-key = escape
terminal-cursor-style = bar
bell-character = vibrate
terminal-transcript-rows = 5000
