# foot terminal. The colours are the whc-theme block at the end (`just theme apply <theme>`).
# Icons come from the Nerd Font symbols fallback (ttf-nerd-fonts-symbols), which fontconfig
# adds behind any primary font.
[main]
font=monospace:size=11
pad=6x4
term=foot
# Keep the spaces: URLs/paths copied from the terminal stay selectable by word.
word-delimiters=,│`|:"'()[]{}<>

[scrollback]
lines=20000

[mouse]
hide-when-typing=yes

# >>> whc-theme >>>
# Generated by whc-theme; edit the theme, not these lines (`whc-theme apply <theme>`).
[main]
initial-color-theme=dark
