# foot terminal, Dracula palette. Icons come from the Nerd Font symbols fallback
# (ttf-nerd-fonts-symbols), which fontconfig adds behind any primary font.
[main]
font=monospace:size=11
pad=6x4
term=foot
# Keep the spaces: URLs/paths copied from the terminal stay selectable by word.
word-delimiters=,│`|:"'()[]{}<>

[scrollback]
lines=20000

[mouse]
hide-when-typing=yes

[colors-dark]
background=282a36
foreground=f8f8f2
regular0=21222c
regular1=ff5555
regular2=50fa7b
regular3=f1fa8c
regular4=bd93f9
regular5=ff79c6
regular6=8be9fd
regular7=f8f8f2
bright0=6272a4
bright1=ff6e6e
bright2=69ff94
bright3=ffffa5
bright4=d6acff
bright5=ff92df
bright6=a4ffff
bright7=ffffff
selection-foreground=f8f8f2
selection-background=44475a
