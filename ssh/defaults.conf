# Appended to ~/.ssh/config by `just setup ssh` (as the last Include). ssh uses the first value
# it finds for each option, so anything in your own Host blocks above wins over these defaults.
# Per-host entries (names, addresses, users) belong in ~/.ssh/config.d/*, which is not tracked.
Host *
    ServerAliveInterval 30
    ServerAliveCountMax 4
    ControlMaster auto
    ControlPath ~/.ssh/control/%C
    ControlPersist 10m
    HashKnownHosts yes
    AddKeysToAgent yes
