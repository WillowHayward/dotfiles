# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'dracula/tmux'

set -g prefix C-Space

# Window numbers are positions; keep panes zero-based for the session layout.
set -g base-index 1
set -g renumber-windows on

# vi-like copying
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'p' send -X paste-selection
#TODO: finish this

set-option -g default-shell /bin/zsh
set-option -g detach-on-destroy off

set-option -g status-position top

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"


run '~/.tmux/plugins/tpm/tpm'
# Keep global bindings after plugins so reloads preserve their meaning.
bind c new-window -a -c "#{pane_current_path}"
bind n new-window -a -c "#{pane_current_path}"
bind p new-window -b -c "#{pane_current_path}"
bind 0 select-window -t :10
# Navigate with prefix then h/l; Ctrl-held variants work too.
bind -r h previous-window
bind -r l next-window
bind -r C-h previous-window
bind -r C-l next-window
bind S setw synchronize-panes

# Ordinary sessions/windows start with one pane, including after a reload.
set-hook -gu after-new-session
set-hook -gu after-new-window
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind M source-file ~/.tmux.session.conf
