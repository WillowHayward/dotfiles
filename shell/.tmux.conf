# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 's'

set -g prefix C-Space

# Window numbers are positions; keep panes zero-based for the session layout.
set -g base-index 1
set -g renumber-windows on

# vi-like copying
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'p' send -X paste-selection
#TODO: finish this

set-option -g default-shell /bin/zsh
# Copy to the terminal's clipboard via OSC 52, which also works over SSH.
set -g set-clipboard on
set-option -g detach-on-destroy off

set-option -g status-position top

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"


# Skip TPM quietly until `just setup tmux` has installed it.
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"

# Match nvim's dracula.nvim palette. Keep the bar focused on session/windows.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB,foot*:RGB,tmux*:RGB'
set -g status-style 'bg=#282A36,fg=#F8F8F2'
set -g status-left-length 40
set -g status-right-length 40
set -g status-left '#[bg=#BD93F9,fg=#282A36,bold] #S #[default] '
set -g status-right '#[fg=#6272A4]%Y-%m-%d #[fg=#8BE9FD]%H:%M '
set -g status-justify left
setw -g window-status-separator ' '
setw -g window-status-style 'fg=#6272A4'
setw -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '
setw -g window-status-current-format '#[bg=#44475A,fg=#BD93F9,bold] #I:#W#{?window_flags,#{window_flags},} #[default]'
setw -g window-status-activity-style 'fg=#F1FA8C'
setw -g window-status-bell-style 'fg=#FF5555,bold'
set -g pane-border-style 'fg=#44475A'
set -g pane-active-border-style 'fg=#BD93F9'
set -g message-style 'bg=#44475A,fg=#F8F8F2'
set -g message-command-style 'bg=#44475A,fg=#8BE9FD'
setw -g mode-style 'bg=#44475A,fg=#F8F8F2'

# Keep global bindings after plugins so reloads preserve their meaning.
bind c new-window -a -c "#{pane_current_path}"
bind n new-window -a -c "#{pane_current_path}"
bind p new-window -b -c "#{pane_current_path}"
bind 0 select-window -t :10
# Navigate with prefix then h/l; Ctrl-held variants work too.
bind -r h previous-window
bind -r l next-window
bind -r C-h previous-window
bind -r C-l next-window
bind S setw synchronize-panes

# Ordinary sessions/windows start with one pane, including after a reload.
set-hook -gu after-new-session
set-hook -gu after-new-window
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
# The project layout is only linked on profiles with developer tooling.
if-shell '[ -r ~/.tmux.session.conf ]' 'bind M source-file ~/.tmux.session.conf'
