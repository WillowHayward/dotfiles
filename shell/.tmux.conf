# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 's'

set -g prefix C-Space

# Window numbers are positions; keep panes zero-based for the session layout.
set -g base-index 1
set -g renumber-windows on

# vi-like copying
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'p' send -X paste-selection
#TODO: finish this

# zsh is /bin/zsh on the desktops and servers; Termux has no /bin, so look it up there.
if-shell '[ -x /bin/zsh ]' 'set-option -g default-shell /bin/zsh' "run-shell 'tmux set-option -g default-shell \"\$(command -v zsh)\"'"
# Copy to the terminal's clipboard via OSC 52, which also works over SSH.
set -g set-clipboard on
set-option -g detach-on-destroy off

# Refresh the Hyprland session signature on attach/new session so hyprctl (and hyprmon) work in new panes.
set -ga update-environment ' HYPRLAND_INSTANCE_SIGNATURE'

set-option -g status-position top

unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"


# Skip TPM quietly until `just setup tmux` has installed it.
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"

# Colours come from whc-theme (shell/.tmux.theme.conf: the @whc_* options and the *-style
# options, per machine); this file keeps the layout. Change them with `just theme apply <theme>`.
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB,foot*:RGB,tmux*:RGB'
%if "#{!=:$WHC_DOTFILES_DIR,}"
source-file -q "$WHC_DOTFILES_DIR/shell/.tmux.theme.conf"
%else
source-file -q "$HOME/dotfiles/shell/.tmux.theme.conf"
%endif
set -g status-left-length 40
set -g status-right-length 120
set -g status-interval 30
# Machine segment (whc-theme picks its colour from WHC_DEVICE), then the session.
# Remote machines and SSH sessions: the session pill is red, like the prompt prefix.
%if "#{!=:$WHC_REMOTE,}"
set -g @whc_session_bg '#FF1F1F'
set -g @whc_session_fg '#FFFFFF'
%endif
set -g status-left '#[bg=#{@whc_status_bg},fg=#{@whc_status_fg},bold] #{E:@whc_device} #[bg=#{@whc_session_bg},fg=#{@whc_session_fg}] #S #[default] '
# AI usage and battery (scripts/status-line.py; segments depend on the profile), then the clock.
# Narrow clients (a phone) get only the time.
set -g status-right '#{?#{e|<:#{client_width},90},#[fg=#{@whc_cyan}]%H:%M ,#(python3 "${WHC_DOTFILES_DIR:-$HOME/dotfiles#}/scripts/status-line.py")  #[fg=#{@whc_comment}]%Y-%m-%d #[fg=#{@whc_cyan}]%H:%M }'
set -g status-justify left
setw -g window-status-separator ' '
setw -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '
setw -g window-status-current-format '#[bg=#{@whc_selection},fg=#{@whc_accent},bold] #I:#W#{?window_flags,#{window_flags},} #[default]'

# Keep global bindings after plugins so reloads preserve their meaning.
bind c new-window -a -c "#{pane_current_path}"
bind n new-window -a -c "#{pane_current_path}"
bind p new-window -b -c "#{pane_current_path}"
bind 0 select-window -t :10
# Navigate with prefix then h/l; Ctrl-held variants work too.
bind -r h previous-window
bind -r l next-window
bind -r C-h previous-window
bind -r C-l next-window
bind S setw synchronize-panes

# Ordinary sessions/windows start with one pane, including after a reload.
set-hook -gu after-new-session
set-hook -gu after-new-window
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
# The project layout is only linked on profiles with developer tooling.
if-shell '[ -r ~/.tmux.session.conf ]' 'bind M source-file ~/.tmux.session.conf'

# prefix g: lazygit in a popup rooted at the current pane's directory.
if-shell 'command -v lazygit' "bind g display-popup -E -d '#{pane_current_path}' -w 90% -h 90% lazygit"

# prefix C: clear the panes of this window that are waiting at a shell prompt (nothing else).
bind C run-shell '"${WHC_DOTFILES_DIR:-$HOME/dotfiles}/scripts/tmux-clear-idle.sh"'
