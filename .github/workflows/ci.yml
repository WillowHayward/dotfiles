name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck
      - uses: extractions/setup-just@v2
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check nvim hypr swayimg
      - run: just check
      - run: just test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  setup:
    name: Setup (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [remote, work, home, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just test-container ${{ matrix.profile }}
