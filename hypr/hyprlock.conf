# Terminal-style lock screen on every monitor.
background {
    monitor =
    color = rgb(080c0a)
}

label {
    monitor =
    text = SESSION LOCKED
    color = rgb(7caa89)
    font_size = 14
    font_family = Adwaita Mono
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = login: $USER
    color = rgb(d5e5d8)
    font_size = 20
    font_family = Adwaita Mono
    position = 0, 65
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 54
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(7caa89)
    inner_color = rgb(080c0a)
    font_color = rgb(d5e5d8)
    font_family = Adwaita Mono
    dots_text_format = *
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = false
    fade_on_empty = false
    placeholder_text = Password: _
    check_color = rgb(d6bb78)
    check_text = Authenticating...
    fail_color = rgb(e58383)
    fail_text = Authentication failed ($ATTEMPTS)
    capslock_color = rgb(d6bb78)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = [ Enter to unlock ]
    color = rgb(7caa89)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, -65
    halign = center
    valign = center
}
